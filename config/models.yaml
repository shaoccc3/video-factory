# 模型 ID、單價、限速、能力表（不含密鑰）。
# BytePlus 的值已按官方文件核對（2026-09-23，見 docs/specs/13-byteplus-verification.md）：
#   模型列表：https://docs.byteplus.com/en/docs/modelark/1330310
#   價格：https://docs.byteplus.com/en/docs/modelark/1544106
#   影片生成接口：https://docs.byteplus.com/en/docs/ModelArk/1520757
# 標「待核對」的值尚未對照官方文件（火山方舟：https://www.volcengine.com/docs/82379）。
# 單價的幣種見 currency（BytePlus 以 USD 計價，火山方舟以 CNY 計價）；賬本按 fx_to_cny 換算成 CNY。
# 切換 ARK_REGION 時，兩個區域的模型 ID 與單價不同，需一併修改本文件。
# 單價一律用牌價；限時折扣（例如 2.0 fast 企業用戶 75 折到 2026-10-07）不計入預估，實際扣費以賬單為準。
region: byteplus              # volcengine（國內）或 byteplus（國際）；實際以環境變量 ARK_REGION 為準
base_url:
  volcengine: https://ark.cn-beijing.volces.com/api/v3
  byteplus: https://ark.ap-southeast.bytepluses.com/api/v3
currency:
  byteplus: USD
  volcengine: CNY
fx_to_cny:                    # 匯率，按需更新
  USD: 7.1
  CNY: 1

models:
  script_llm:
    id: "seed-2-0-lite-260428"
    price_per_mtok_input: 0.25    # 每百萬 token；提示 ≤128K 檔（(128K, 256K] 為 0.50／4.00，本項目提示遠低於 128K）
    price_per_mtok_output: 2.00   # 含思維鏈 token（預設開啟深度思考）
    rpm: 60                       # 官方上限 30K RPM、1500K TPM
    concurrency: 4
  keyframe:
    id: "seedream-5-0-lite-260128"  # 模型列表的主 ID 為 seedream-5-0-260128，兩者等價
    price_per_image: 0.035          # 每張輸出圖；輸入參考圖免費
    image_sizes:                    # 5.0 lite 總像素須在 [2560x1440, 4096x4096]；取官方 2K 對照表
      "16:9": "2848x1600"
      "9:16": "1600x2848"
      "1:1": "2048x2048"
      "4:3": "2304x1728"
      "3:4": "1728x2304"
      "21:9": "3136x1344"
    rpm: 30                         # 官方上限 500 IPM
    concurrency: 2
  video_draft:                # 樣片：Seedance 2.0 fast
    id: "dreamina-seedance-2-0-fast-260128"
    price_per_mtok: 5.6       # 480p／720p，輸入不含影片；輸入含影片為 3.3
    rpm: 10                   # 官方上限：企業 600 RPM／並發 10，個人 180 RPM／並發 3
    concurrency: 2
    capabilities:
      resolutions: ["480p", "720p"]
      ratios: ["9:16", "16:9", "1:1", "4:3", "3:4", "21:9"]
      min_duration_s: 4
      max_duration_s: 15
      fps: 24
      supports_draft: false   # draft 只有 2.5 與 1.5 pro 支援
      supports_audio: true
      supports_seed: false    # seed 只有 1.x 支援
      reference_audio_needs_visual: true  # 2.0 系列不支援只有參考音頻
      image_roles: ["first_frame", "last_frame", "reference_image", "reference_video", "reference_audio"]
      max_reference_images: 9
      max_reference_videos: 3
      max_reference_audios: 3
      dimensions: &seedance_2_0_dims  # Seedance 2.0 系列官方寬高表（fast 只用到 480p／720p）
        "480p": {"16:9": "864x496", "4:3": "752x560", "1:1": "640x640", "3:4": "560x752", "9:16": "496x864", "21:9": "992x432"}
        "720p": {"16:9": "1280x720", "4:3": "1112x834", "1:1": "960x960", "3:4": "834x1112", "9:16": "720x1280", "21:9": "1470x630"}
        "1080p": {"16:9": "1920x1080", "4:3": "1664x1248", "1:1": "1440x1440", "3:4": "1248x1664", "9:16": "1080x1920", "21:9": "2206x946"}
  video_final:                # 正片：Seedance 2.0
    id: "dreamina-seedance-2-0-260128"
    price_per_mtok: 7.0       # 480p／720p，輸入不含影片；輸入含影片為 4.3
    price_per_mtok_by_resolution:
      "1080p": 7.7            # 輸入含影片為 4.7；4K 為 4.0／2.4（本項目不用 4K）
    rpm: 10
    concurrency: 2
    capabilities:
      resolutions: ["480p", "720p", "1080p"]
      ratios: ["9:16", "16:9", "1:1", "4:3", "3:4", "21:9"]
      min_duration_s: 4
      max_duration_s: 15
      fps: 24
      supports_draft: false
      supports_audio: true
      supports_seed: false
      reference_audio_needs_visual: true
      image_roles: ["first_frame", "last_frame", "reference_image", "reference_video", "reference_audio"]
      max_reference_images: 9
      max_reference_videos: 3
      max_reference_audios: 3
      dimensions: *seedance_2_0_dims
  video_long:                 # 長鏡頭：Seedance 2.5（行銷模板使用）
    id: "dreamina-seedance-2-5-260628"
    price_per_mtok: 10.70     # 480p／720p，輸入不含影片；輸入含影片為 6.40
    price_per_mtok_by_resolution:
      "1080p": 11.7           # 輸入含影片為 7.0；1080p 輸出為 10-bit H.265
    rpm: 10
    concurrency: 2
    capabilities:
      resolutions: ["480p", "720p", "1080p"]
      ratios: ["9:16", "16:9", "1:1", "4:3", "3:4", "21:9"]
      min_duration_s: 4
      max_duration_s: 30
      fps: 24
      supports_draft: false   # 2.5 支援 draft（只能 480p），但樣片走 video_draft，不用兩步流程
      supports_audio: true
      supports_seed: false
      frames_require_adaptive_ratio: true  # 帶首幀／尾幀時 ratio 只能 adaptive
      reference_audio_needs_visual: false  # 2.5 可以只送參考音頻
      image_roles: ["first_frame", "last_frame", "reference_image", "reference_video", "reference_audio"]
      max_reference_images: 30
      max_reference_videos: 10
      max_reference_audios: 10
      dimensions:             # 與 2.0 只差 480p 的 16:9、9:16
        "480p": {"16:9": "854x480", "4:3": "752x560", "1:1": "640x640", "3:4": "560x752", "9:16": "480x854", "21:9": "992x432"}
        "720p": {"16:9": "1280x720", "4:3": "1112x834", "1:1": "960x960", "3:4": "834x1112", "9:16": "720x1280", "21:9": "1470x630"}
        "1080p": {"16:9": "1920x1080", "4:3": "1664x1248", "1:1": "1440x1440", "3:4": "1248x1664", "9:16": "1080x1920", "21:9": "2206x946"}
  tts:                        # 豆包語音，只用於國內版（ARK_REGION=volcengine）；BytePlus 文件沒有此服務
    id: "<音色 voice_type>"
    price_per_kchar: 0.02     # 每千字（待核對：需看火山引擎文件或控制台）
    rpm: 60
    concurrency: 4

budget:                       # 示例值（CNY），按 2026-09-23 官方牌價試算調整；管理頁可覆蓋
  per_job_cny: 150            # 行銷片一條約 62（樣片 12 + 正片 49 + 關鍵幀與腳本）
  per_user_daily_cny: 600
